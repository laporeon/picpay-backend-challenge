services:
  postgresql:
    container_name: picpay-database
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${PG_USERNAME:-admin}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:-dbpassword}"
      POSTGRES_DB: "${POSTGRES_DB:-picpay_db}"
    volumes:
      - picpay_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  picpay_postgres_data:
